name: Feature request
description: Suggest something ccOverhead could show or do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [PRODUCT.md](https://github.com/shengyy/ccoverhead/blob/main/PRODUCT.md) first, especially its non-goals.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to know or decide while working, that the band doesn't help with today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
